name: Build AZ Anime Wallpaper
on:
  push:
    branches: [feature/az-anime-motion-wallpaper]
    paths: ['anime-wallpaper/**', '.github/workflows/build-az-anime-wallpaper.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          gradle --version || true
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AZAnimeWallpaper-debug-apk
          path: anime-wallpaper/app/build/outputs/apk/debug/*.apk
