name: Release APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download Three.js r160
        run: |
          mkdir -p android/app/src/main/assets/www/js
          curl -fsSL \
            "https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js" \
            -o android/app/src/main/assets/www/js/three.min.js
          echo "Three.js: $(wc -c < android/app/src/main/assets/www/js/three.min.js) bytes"

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret found — will build debug APK instead."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.keystore

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.available == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Locate and rename APK
        id: apk
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            SRC="android/app/build/outputs/apk/release/app-release.apk"
            LABEL="signed"
          else
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            LABEL="debug-unsigned"
          fi
          DEST="NeonRacer-${{ steps.version.outputs.version }}-${LABEL}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges | head -20)
          else
            LOG=$(git log --oneline --no-merges | head -20)
          fi
          APK_NAME="${{ steps.apk.outputs.apk_path }}"
          LABEL="${{ steps.apk.outputs.label }}"
          {
            echo "notes<<EOF"
            echo "## Neon Racer ${{ steps.version.outputs.version }}"
            if [ "$LABEL" = "debug-unsigned" ]; then
              echo ""
              echo "> ⚠️ **Debug build** — no signing secrets were configured."
              echo "> To get a signed release APK, add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD to repo secrets."
            fi
            echo ""
            echo "### Changes"
            echo "${LOG}"
            echo ""
            echo "### Install"
            echo "Download \`${APK_NAME}\` and install on Android."
            echo "You may need to allow installs from unknown sources."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Neon Racer ${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ steps.signing.outputs.available == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/keystore/release.keystore
